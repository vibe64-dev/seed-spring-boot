spring.application.name=app

# Listen where the environment says; Spring reads SERVER_PORT, not PORT, by itself.
server.address=${HOST:127.0.0.1}
server.port=${PORT:8080}

# Trust X-Forwarded-* from a reverse proxy on the same machine so redirects and
# cookies use the browser-facing origin.
server.forward-headers-strategy=native
server.tomcat.remoteip.host-header=X-Forwarded-Host
server.tomcat.remoteip.port-header=X-Forwarded-Port
server.tomcat.use-relative-redirects=true

# MySQL or MariaDB, from the environment. Flyway owns the schema.
spring.datasource.url=jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
